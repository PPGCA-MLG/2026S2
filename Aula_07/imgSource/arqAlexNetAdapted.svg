<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="340" viewBox="0 0 1620 340" id="svg_alexnet_cifar100">
  <defs id="defs1">
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Fundo Branco Limpo -->
  <rect id="bg" width="1620" height="340" fill="#ffffff" />

  <!-- ===================================================================== -->
  <!-- CAMADA: ALEXNET ADAPTADA PARA CIFAR-100 (32x32)                      -->
